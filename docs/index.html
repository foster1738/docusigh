<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DocuSigh — Bulletproof HTML Email Composer</title>
<meta name="description" content="Compose bulletproof, client-safe HTML emails and preview them live. Powered by @docusigh/email." />
<style>
  :root {
    color-scheme: light dark;
    --bg: #f4f4f7; --panel: #ffffff; --ink: #1a1d24; --muted: #6b7280;
    --border: #e5e7eb; --brand: #2563eb; --brand-ink: #ffffff; --code-bg: #0b0d12; --code-ink: #d6deeb;
    --radius: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0b0d12; --panel: #14171d; --ink: #e6e8ec; --muted: #9aa1ac; --border: #262a33; --code-bg: #05070b; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--bg); color: var(--ink); }
  header { padding: 20px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  header h1 { font-size: 18px; margin: 0; font-weight: 700; }
  header .tag { font-size: 12px; color: var(--muted); border: 1px solid var(--border); border-radius: 999px; padding: 2px 10px; }
  header .spacer { flex: 1; }
  header a { color: var(--brand); text-decoration: none; font-size: 13px; }
  main { display: grid; grid-template-columns: 380px 1fr; gap: 0; min-height: calc(100vh - 63px); }
  @media (max-width: 880px) { main { grid-template-columns: 1fr; } }
  .controls { padding: 20px 24px; border-right: 1px solid var(--border); overflow-y: auto; }
  .controls h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin: 24px 0 10px; }
  .controls h2:first-child { margin-top: 0; }
  label { display: block; font-size: 13px; font-weight: 600; margin: 12px 0 4px; }
  input, textarea, select { width: 100%; padding: 9px 11px; border: 1px solid var(--border); border-radius: 8px; background: var(--panel); color: var(--ink); font: inherit; font-size: 14px; }
  textarea { resize: vertical; min-height: 64px; }
  input[type="color"] { padding: 3px; height: 40px; cursor: pointer; }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }
  .preview { display: flex; flex-direction: column; min-width: 0; }
  .toolbar { padding: 12px 20px; border-bottom: 1px solid var(--border); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; background: var(--panel); }
  .toolbar .spacer { flex: 1; }
  button.btn { border: 1px solid var(--border); background: var(--panel); color: var(--ink); border-radius: 8px; padding: 8px 14px; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; }
  button.btn:hover { border-color: var(--brand); }
  button.btn.primary { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; background: var(--panel); color: var(--muted); padding: 8px 14px; font: inherit; font-size: 13px; cursor: pointer; }
  .seg button.active { background: var(--brand); color: var(--brand-ink); }
  .stage { flex: 1; overflow: auto; padding: 24px; display: flex; justify-content: center; background: var(--bg); }
  .frame-wrap { width: 100%; max-width: 640px; transition: max-width 0.2s ease; }
  .frame-wrap.mobile { max-width: 380px; }
  iframe { width: 100%; height: 72vh; border: 1px solid var(--border); border-radius: var(--radius); background: #fff; }
  pre { margin: 0; background: var(--code-bg); color: var(--code-ink); padding: 20px; border-radius: var(--radius); overflow: auto; font: 12px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; height: 72vh; white-space: pre-wrap; word-break: break-word; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-size: 13px; opacity: 0; transition: opacity 0.2s; pointer-events: none; }
  .toast.show { opacity: 1; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <h1>Bulletproof HTML Email Composer</h1>
  <span class="tag">DocuSigh</span>
  <div class="spacer"></div>
  <a href="https://github.com/foster1738/docusigh" target="_blank" rel="noopener">View source on GitHub →</a>
</header>
<main>
  <section class="controls">
    <h2>Template</h2>
    <select id="template">
      <option value="invitation">Signing invitation</option>
      <option value="completed">Signing completed</option>
    </select>

    <h2>Content</h2>
    <label>From / sender name</label>
    <input id="senderName" value="Acme Legal" />
    <label>Recipient name</label>
    <input id="signerName" value="Sam Signer" />
    <label>Document name</label>
    <input id="documentName" value="Mutual NDA" />
    <label id="urlLabel">Signing URL</label>
    <input id="signUrl" value="https://app.docusigh.com/sign/9f2c1a" />
    <div id="messageField">
      <label>Personal message (optional)</label>
      <textarea id="message">Thanks for partnering with us — this should only take a minute.</textarea>
    </div>
    <div id="expiresField">
      <label>Expires (optional)</label>
      <input id="expiresAt" value="March 1, 2026" />
    </div>

    <h2>Branding</h2>
    <div class="row">
      <div><label>Brand color</label><input id="brandColor" type="color" value="#2563eb" /></div>
      <div><label>Button text color</label><input id="buttonTextColor" type="color" value="#ffffff" /></div>
    </div>
    <label>Preheader (inbox preview text)</label>
    <input id="preheader" value="" placeholder="Auto-generated if left blank" />
    <div class="hint">Everything is rendered in your browser with the same code the sender uses. Nothing is uploaded.</div>

    <h2>Footer</h2>
    <label>Company / footer lines</label>
    <input id="footerName" value="DocuSigh Inc." />
    <label>Mailing address (CAN-SPAM)</label>
    <input id="footerAddress" value="123 Market St, San Francisco, CA 94103" />
    <label>Unsubscribe URL</label>
    <input id="unsubUrl" value="https://app.docusigh.com/unsubscribe/9f2c1a" />
  </section>

  <section class="preview">
    <div class="toolbar">
      <div class="seg" id="viewSeg">
        <button data-view="preview" class="active">Preview</button>
        <button data-view="html">HTML</button>
        <button data-view="text">Plain text</button>
      </div>
      <div class="seg" id="widthSeg" hidden>
        <button data-width="desktop" class="active">Desktop</button>
        <button data-width="mobile">Mobile</button>
      </div>
      <div class="spacer"></div>
      <button class="btn" id="copyBtn">Copy HTML</button>
      <button class="btn primary" id="downloadBtn">Download .html</button>
    </div>
    <div class="stage">
      <div class="frame-wrap" id="frameWrap">
        <iframe id="frame" title="Email preview" sandbox="allow-same-origin"></iframe>
        <pre id="htmlOut" hidden></pre>
        <pre id="textOut" hidden></pre>
      </div>
    </div>
  </section>
</main>
<div class="toast" id="toast"></div>

<script src="./app.bundle.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var lastRendered = { html: "", text: "" };

  function buildInput() {
    var template = $("template").value;
    var footer = {
      lines: $("footerName").value ? [$("footerName").value] : [],
      address: $("footerAddress").value || undefined,
      unsubscribeUrl: $("unsubUrl").value || undefined,
    };
    var theme = { brandColor: $("brandColor").value, buttonTextColor: $("buttonTextColor").value };
    var header = { name: $("senderName").value };
    var common = { header: header, footer: footer, theme: theme };

    if (template === "completed") {
      return Bulletproof.renderSigningCompleted(Object.assign({
        signerName: $("signerName").value || undefined,
        documentName: $("documentName").value,
        downloadUrl: $("signUrl").value,
      }, common));
    }
    return Bulletproof.renderSigningInvitation(Object.assign({
      senderName: $("senderName").value,
      signerName: $("signerName").value || undefined,
      documentName: $("documentName").value,
      signUrl: $("signUrl").value,
      message: $("message").value || undefined,
      expiresAt: $("expiresAt").value || undefined,
    }, common));
  }

  function render() {
    if (typeof Bulletproof === "undefined") return;
    try {
      lastRendered = buildInput();
    } catch (e) {
      lastRendered = { html: "<pre>" + String(e) + "</pre>", text: String(e) };
    }
    $("frame").srcdoc = lastRendered.html;
    $("htmlOut").textContent = lastRendered.html;
    $("textOut").textContent = lastRendered.text;
    // Adjust labels for the completion template.
    var completed = $("template").value === "completed";
    $("urlLabel").textContent = completed ? "Download URL" : "Signing URL";
    $("messageField").hidden = completed;
    $("expiresField").hidden = completed;
  }

  function toast(msg) {
    var t = $("toast"); t.textContent = msg; t.classList.add("show");
    clearTimeout(t._timer); t._timer = setTimeout(function () { t.classList.remove("show"); }, 1600);
  }

  // View switching
  $("viewSeg").addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    [].forEach.call(this.children, function (c) { c.classList.remove("active"); });
    b.classList.add("active");
    var view = b.dataset.view;
    $("frame").hidden = view !== "preview";
    $("htmlOut").hidden = view !== "html";
    $("textOut").hidden = view !== "text";
    $("widthSeg").hidden = view !== "preview";
  });
  $("widthSeg").addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    [].forEach.call(this.children, function (c) { c.classList.remove("active"); });
    b.classList.add("active");
    $("frameWrap").classList.toggle("mobile", b.dataset.width === "mobile");
  });

  function copyText(text, label) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { toast(label + " copied"); }, function () { toast("Copy failed"); });
    } else {
      var ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); toast(label + " copied"); } catch (_) { toast("Copy failed"); }
      document.body.removeChild(ta);
    }
  }
  $("copyBtn").addEventListener("click", function () {
    var isText = !$("textOut").hidden;
    copyText(isText ? lastRendered.text : lastRendered.html, isText ? "Plain text" : "HTML");
  });
  $("downloadBtn").addEventListener("click", function () {
    var blob = new Blob([lastRendered.html], { type: "text/html" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = ($("documentName").value || "email").replace(/[^a-z0-9]+/gi, "-").toLowerCase() + ".html";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  });

  // Re-render on any input change.
  document.querySelectorAll("input, textarea, select").forEach(function (el) {
    el.addEventListener("input", render);
    el.addEventListener("change", render);
  });

  if (typeof Bulletproof === "undefined") {
    $("frame").srcdoc = "<p style='font-family:sans-serif;padding:24px'>Could not load the renderer bundle (app.bundle.js). Run <code>npm run build:browser</code>.</p>";
  } else {
    render();
  }
})();
</script>
</body>
</html>
